  <style>
    :root{color-scheme:light;--black:#0b0d0a;--ink:#12140f;--white:#fff;--paper:#f7f8f5;--soft:#edf1e8;--muted:#71766d;--line:rgba(18,20,15,.16);--green:#68ad19;--green-deep:#477d08;--gutter:clamp(20px,4.6vw,96px);--content:min(1680px,calc(100vw - (var(--gutter) * 2)));font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y mandatory;scroll-padding-top:0;overflow-x:hidden}body{min-width:320px;margin:0;overflow-x:hidden;color:var(--ink);background:var(--white);font-size:clamp(15px,.45vw + 12px,18px);line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}img{display:block;max-width:100%}a{color:inherit;-webkit-tap-highlight-color:transparent}:focus-visible{outline:3px solid var(--green);outline-offset:4px}h1,h2,h3,p{margin-top:0}.container{width:var(--content);margin-inline:auto}.hero,.section,.contact{scroll-snap-align:start;scroll-snap-stop:always}.site-footer{scroll-snap-align:end}
    .site-header{position:absolute;inset:0 0 auto;z-index:10;height:clamp(68px,5.2vw,80px);color:var(--ink);border-bottom:1px solid var(--line)}.nav{height:100%;display:grid;grid-template-columns:minmax(168px,1fr) auto minmax(168px,1fr);align-items:center;gap:32px}.brand{display:inline-flex;width:fit-content;align-items:center;gap:13px;text-decoration:none;white-space:nowrap}.brand-crop{width:47px;height:35px;overflow:hidden;background:var(--white)}.brand-crop img{width:100%;height:100%;object-fit:cover;transform:scale(2.26)}.brand-name{font-size:14px;font-weight:720;letter-spacing:-.02em}.nav-links{display:flex;align-items:center;justify-content:center;gap:clamp(24px,3vw,54px)}.nav-links a,.nav-contact{position:relative;color:var(--muted);text-decoration:none;font-size:13px;font-weight:620;white-space:nowrap;transition:color .22s ease}.nav-links a:after{content:"";position:absolute;right:0;bottom:-10px;left:0;height:2px;background:var(--green);transform:scaleX(0);transition:transform .22s ease}.nav-links a:hover,.nav-contact:hover{color:var(--ink)}.nav-links a:hover:after{transform:scaleX(1)}.nav-contact{justify-self:end;color:var(--ink)}
    .hero{position:relative;min-height:100dvh;display:grid;place-items:center;overflow:hidden;color:var(--ink);background:var(--white)}.hero:before{content:"";position:absolute;inset:0;opacity:.55;background:radial-gradient(circle at 82% 20%,rgba(104,173,25,.11),transparent 27%);pointer-events:none}.hero-inner{position:relative;width:var(--content);min-height:100dvh;display:grid;grid-template-columns:minmax(0,.82fr) minmax(340px,1.18fr);align-items:center;gap:clamp(40px,7vw,132px);padding:clamp(112px,9vw,150px) 0 clamp(52px,6vw,90px)}.hero-copy{align-self:center}.hero-label,.hero-copy>p:not(.hero-label),.hero-index{display:none}h1{max-width:780px;margin-bottom:34px;font-size:clamp(46px,5.4vw,104px);font-weight:780;line-height:.98;letter-spacing:-.065em}.hero-action{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 24px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font-size:14px;font-weight:680;white-space:nowrap;transition:color .24s ease,background .24s ease,transform .24s cubic-bezier(.16,1,.3,1)}.hero-action:hover{color:var(--white);background:var(--ink)}.hero-action:active{transform:translateY(1px) scale(.98)}.hero-logo-stage{position:relative;width:min(100%,780px);justify-self:end}.hero-logo-stage:before{display:none}.hero-logo-stage img{width:100%;height:auto;transform:rotate(1.2deg)}
    section:not(.hero){scroll-margin-top:0}.section{min-height:100dvh;display:grid;align-items:center;padding:clamp(72px,8vw,140px) 0}.about-grid{display:block}.about-copy h2,.coverage-copy h2{max-width:1100px;margin-bottom:clamp(44px,6vw,90px);font-size:clamp(48px,7vw,132px);font-weight:780;line-height:.95;letter-spacing:-.07em}.about-bottom{display:block}.founded{width:fit-content;padding-top:28px;border-top:1px solid var(--line)}.founded strong{display:block;color:var(--green-deep);font-size:clamp(64px,8vw,148px);font-weight:780;line-height:.9;letter-spacing:-.07em}
    .advantages{background:var(--paper)}.advantages-heading{margin-bottom:clamp(44px,6vw,86px)}.advantages-heading h2{max-width:1000px;margin:0;font-size:clamp(42px,5.6vw,100px);font-weight:780;line-height:.98;letter-spacing:-.065em}.advantage-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.advantage{min-height:clamp(220px,20vw,340px);display:grid;place-items:center;padding:clamp(24px,2.6vw,44px);border-right:1px solid var(--line);transition:color .26s ease,background .26s ease}.advantage:last-child{border-right:0}.advantage:hover{color:var(--white);background:var(--black)}.advantage h3{margin:0;font-size:clamp(27px,2.4vw,46px);font-weight:750;line-height:1;letter-spacing:-.05em;text-align:center}
    .coverage{position:relative;overflow:hidden}.coverage:after{content:"NATIONWIDE";position:absolute;right:-.04em;bottom:-.24em;z-index:-1;color:var(--soft);font-size:clamp(120px,20vw,420px);font-weight:850;line-height:.75;letter-spacing:-.08em;white-space:nowrap}.coverage-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:clamp(48px,10vw,180px);align-items:end}.coverage-stat{padding:28px 0 8px 30px;border-left:1px solid var(--line)}.coverage-stat strong{display:block;color:var(--green-deep);font-size:clamp(72px,8vw,150px);font-weight:800;line-height:.9;letter-spacing:-.08em}.contact{min-height:100dvh;display:grid;align-items:center;padding:clamp(56px,7vw,110px) 0}.contact-panel{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(48px,9vw,160px);padding:clamp(38px,6vw,92px);background:var(--soft)}.contact-copy h2{margin:0;font-size:clamp(30px,3vw,50px);font-weight:750;line-height:1;letter-spacing:-.045em}.contact-list{display:grid;align-content:center;gap:0;margin:0;border-top:1px solid var(--line)}.contact-row{display:grid;grid-template-columns:minmax(90px,.34fr) minmax(0,1fr);gap:24px;padding:20px 0;border-bottom:1px solid var(--line)}.contact-row dt{color:var(--muted);font-size:12px}.contact-row dd{margin:0;font-size:clamp(15px,1.05vw,18px);font-weight:620;line-height:1.5;overflow-wrap:anywhere}.contact-row a{text-decoration-thickness:1px;text-underline-offset:5px}.email-text{user-select:text}
    .site-footer{padding:32px 0 40px;border-top:1px solid var(--line)}.footer-layout{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:28px;color:var(--muted);font-size:11px}.footer-layout p{margin:0}.footer-layout .footer-brand{color:var(--ink);font-weight:760;text-align:center;letter-spacing:.08em}.footer-layout a{justify-self:end;text-decoration:none}.footer-layout a:hover{color:var(--ink)}.reveal{opacity:0;transform:translateY(28px)}.reveal.is-visible{opacity:1;transform:translateY(0);transition:opacity .76s cubic-bezier(.16,1,.3,1),transform .76s cubic-bezier(.16,1,.3,1)}.hero-logo-stage.reveal.is-visible{transition-delay:.12s}
    @media(min-width:1920px){:root{--content:min(1760px,calc(100vw - 160px))}.hero-inner{grid-template-columns:minmax(0,.9fr) minmax(620px,1.1fr)}}@media(min-width:2400px){:root{--content:min(2120px,calc(100vw - 240px))}body{font-size:20px}.hero-logo-stage{max-width:900px}}
    @media(max-width:1100px){.hero-inner{grid-template-columns:minmax(0,.95fr) minmax(330px,1.05fr);gap:48px}.nav{grid-template-columns:1fr auto}.nav-links{display:none}.advantage-list{grid-template-columns:repeat(2,minmax(0,1fr))}.advantage:nth-child(2){border-right:0}.advantage:nth-child(-n+2){border-bottom:1px solid var(--line)}}
    @media(max-width:760px){:root{--gutter:clamp(18px,5vw,28px)}.site-header{height:66px}.brand-name{font-size:13px}.nav-contact{color:var(--green-deep)}.hero-inner{min-height:100svh;grid-template-columns:1fr;gap:30px;padding:94px 0 34px}.hero-copy{align-self:auto}.hero-logo-stage{width:min(72vw,410px);justify-self:center}.section,.contact{min-height:100svh;padding:64px 0}.about-copy h2,.coverage-copy h2{margin-bottom:38px}.coverage-grid,.contact-panel{grid-template-columns:1fr}.founded,.coverage-stat{padding:22px 0 0;border-top:1px solid var(--line);border-left:0}.advantage-list{grid-template-columns:repeat(2,minmax(0,1fr))}.advantage{min-height:clamp(138px,38vw,190px);padding:20px;border-bottom:1px solid var(--line)}.advantage:nth-child(2n){border-right:0}.advantage h3{font-size:clamp(21px,6vw,30px)}.contact-panel{gap:40px}.contact-row{grid-template-columns:1fr;gap:5px;padding:16px 0}.footer-layout{grid-template-columns:1fr;align-items:start;gap:10px}.footer-layout .footer-brand{text-align:left}.footer-layout a{justify-self:start}}
    @media(max-width:390px){.brand-name{display:none}h1{font-size:43px}}
    @media(max-width:760px) and (max-height:700px){.hero-inner{gap:14px;padding:72px 0 20px}.hero-logo-stage{width:min(54vw,210px)}.hero-action{min-height:42px}.section,.contact{padding:48px 0}.advantages-heading{margin-bottom:28px}.advantage{min-height:112px}.contact-panel{gap:26px;padding:28px}.contact-row{padding:12px 0}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto;scroll-snap-type:none}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}}
  </style>
</head>
<body>
  <header class="site-header"><nav class="nav container" aria-label="主导航"><a class="brand" href="#top" aria-label="上海枷捷贸易有限公司首页"><span class="brand-crop" aria-hidden="true"><img src="assets/jiajie-wordmark-white-black.png" alt=""></span><span class="brand-name">上海枷捷贸易</span></a><div class="nav-links"><a href="#about">关于我们</a><a href="#advantages">核心优势</a><a href="#coverage">服务范围</a></div><a class="nav-contact" href="#contact">联系我们</a></nav></header>
  <main id="top">
    <section class="hero"><div class="hero-inner"><div class="hero-copy reveal"><h1>可靠货源<br>连接市场</h1><a class="hero-action" href="#contact">联系我们</a></div><div class="hero-logo-stage reveal"><img src="assets/jiajie-wordmark-white-black.png" alt="JIAJIE 枷捷品牌字标"></div></div></section>
    <section class="section" id="about"><div class="about-grid container"><div class="about-copy reveal"><h2>专注产品与服务，让合作更简单</h2><div class="about-bottom"><div class="founded"><strong>2019</strong></div></div></div></div></section>
    <section class="section advantages" id="advantages"><div class="container"><div class="advantages-heading reveal"><h2>稳定合作，来自每个环节的认真</h2></div><div class="advantage-list"><article class="advantage reveal"><h3>稳定货源</h3></article><article class="advantage reveal"><h3>价格优势</h3></article><article class="advantage reveal"><h3>品牌授权</h3></article><article class="advantage reveal"><h3>售后服务</h3></article></div></div></section>
    <section class="section coverage" id="coverage"><div class="coverage-grid container"><div class="coverage-copy reveal"><h2>立足上海<br>服务全国</h2></div><div class="coverage-stat reveal"><strong>全国</strong></div></div></section>
    <section class="section contact" id="contact"><div class="contact-panel container reveal"><div class="contact-copy"><h2>期待与您合作</h2></div><dl class="contact-list"><div class="contact-row"><dt>公司座机</dt><dd><a href="tel:02159502728">021-59502728</a></dd></div><div class="contact-row"><dt>公司邮箱</dt><dd><span class="email-text">fumengyao@jiajietrade.email</span></dd></div><div class="contact-row"><dt>办公地址</dt><dd>上海市松江区金地威新·虹桥科创园（北园）2号楼104</dd></div></dl></div></section>
  </main>
  <footer class="site-footer"><div class="footer-layout container"><p>© <span id="year">2026</span> 上海枷捷贸易有限公司</p><p class="footer-brand">JIAJIE TRADING</p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">沪ICP备2026033233号</a></div></footer>
  <script>
    document.getElementById('year').textContent=new Date().getFullYear();
    const els=document.querySelectorAll('.reveal');
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce||!('IntersectionObserver'in window)){
      els.forEach(el=>el.classList.add('is-visible'));
    }else{
      const observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      },{threshold:.12});
      els.forEach(el=>observer.observe(el));
    }

    if(!reduce){
      const pages=[document.querySelector('.hero'),document.getElementById('about'),document.getElementById('advantages'),document.getElementById('coverage'),document.getElementById('contact')];
      let wheelLocked=false;
      let wheelTotal=0;
      let wheelReset;
      document.addEventListener('wheel',event=>{
        if(event.ctrlKey||Math.abs(event.deltaY)<4)return;
        wheelTotal+=event.deltaY;
        clearTimeout(wheelReset);
        wheelReset=setTimeout(()=>{wheelTotal=0},160);
        if(wheelLocked||Math.abs(wheelTotal)<32){
          event.preventDefault();
          return;
        }
        const current=pages.reduce((best,page,index)=>Math.abs(page.getBoundingClientRect().top)<Math.abs(pages[best].getBoundingClientRect().top)?index:best,0);
        const next=current+(wheelTotal>0?1:-1);
        if(next<0||next>=pages.length)return;
        event.preventDefault();
        wheelTotal=0;
        wheelLocked=true;
        pages[next].scrollIntoView({behavior:'smooth',block:'start'});
        setTimeout(()=>{wheelLocked=false},720);
      },{passive:false});
    }
  </script>
</body>
</html>
