<!doctype html>
<html lang="zh-CN">
<head>

  <style>
    :root{color-scheme:light;--black:#0b0d0a;--ink:#12140f;--white:#fff;--paper:#f7f8f5;--soft:#edf1e8;--muted:#71766d;--line:rgba(18,20,15,.16);--green:#68ad19;--green-deep:#477d08;--gutter:clamp(20px,4.6vw,96px);--content:min(1680px,calc(100vw - (var(--gutter) * 2)));font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y mandatory;scroll-padding-top:0;overflow-x:hidden}body{min-width:320px;margin:0;overflow-x:hidden;color:var(--ink);background:var(--white);font-size:clamp(15px,.45vw + 12px,18px);line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}img{display:block;max-width:100%}a{color:inherit;-webkit-tap-highlight-color:transparent}:focus-visible{outline:3px solid var(--green);outline-offset:4px}h1,h2,h3,p{margin-top:0}.container{width:var(--content);margin-inline:auto}.hero,.section,.contact{scroll-snap-align:start;scroll-snap-stop:always}.site-footer{scroll-snap-align:end}
    .site-header{position:absolute;inset:0 0 auto;z-index:10;height:clamp(64px,4.8vw,74px);color:var(--ink);border-bottom:1px solid var(--line)}.nav{height:100%;display:grid;grid-template-columns:minmax(240px,1fr) auto minmax(240px,1fr);align-items:center;gap:32px}.brand{display:inline-flex;width:fit-content;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}.brand-crop,.brand-mark{display:block;overflow:hidden;background-color:var(--white);background-image:url("assets/jiajie-logo.jpg");background-repeat:no-repeat;background-size:155% auto;background-position:50% 17%}.brand-crop{width:38px;height:38px;flex:0 0 auto}.brand-name,.nav-links a,.nav-contact{color:var(--muted);font-size:12px;font-weight:500}.brand-name{letter-spacing:normal}.nav-links{display:flex;align-items:center;justify-content:center;gap:clamp(30px,4vw,68px)}.nav-links a,.nav-contact{position:relative;text-decoration:none;white-space:nowrap;transition:color .22s ease}.nav-links a:after{content:"";position:absolute;right:0;bottom:-10px;left:0;height:1px;background:var(--green);transform:scaleX(0);transition:transform .22s ease}.nav-links a:hover,.nav-contact:hover{color:var(--ink)}.nav-links a:hover:after{transform:scaleX(1)}.nav-contact{justify-self:end}
    .hero{position:relative;min-height:100dvh;display:grid;place-items:center;overflow:hidden;color:var(--ink);background:linear-gradient(180deg,var(--white) 0%,var(--white) 72%,#faf9f6 100%)}.hero:before{content:"";position:absolute;inset:0;opacity:.42;background:radial-gradient(circle at 72% 34%,rgba(104,173,25,.09),transparent 25%);pointer-events:none}.hero-inner{position:relative;width:var(--content);min-height:100dvh;display:grid;place-items:center;padding:clamp(80px,7vw,104px) 0 32px}.hero-lockup{display:flex;align-items:center;justify-content:center;gap:clamp(20px,2.8vw,42px);user-select:none}.brand-mark{width:clamp(90px,10.5vw,150px);aspect-ratio:1}.hero-wordmark{display:flex;gap:.26em;margin:0;color:var(--green-deep);background:linear-gradient(90deg,#94cc2e 0%,#70b91f 52%,#579d15 100%);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-size:clamp(64px,9vw,136px);font-weight:900;line-height:.82;letter-spacing:-.085em;white-space:nowrap}.hero-wordmark span{display:block}
    section:not(.hero){scroll-margin-top:0}.section{min-height:100dvh;display:grid;align-items:center;padding:clamp(72px,8vw,132px) 0}.about-section{position:relative;isolation:isolate;overflow:hidden;background-color:#faf9f6;background-image:linear-gradient(180deg,rgba(250,249,246,1) 0%,rgba(250,249,246,.86) 10%,rgba(250,249,246,0) 24%),linear-gradient(90deg,rgba(250,249,246,.98) 0%,rgba(250,249,246,.9) 30%,rgba(250,249,246,.34) 55%,rgba(250,249,246,.02) 76%),url("assets/company-floral-background-v4.png");background-position:center;background-size:cover;background-repeat:no-repeat}.about-section:after{content:"";position:absolute;right:0;bottom:0;left:0;height:22vh;background:linear-gradient(180deg,rgba(247,248,245,0),var(--paper));pointer-events:none}.about-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,7fr) minmax(280px,5fr);align-items:center}.about-copy{position:relative;z-index:1}.about-copy h2,.advantages-heading h2{margin:0;font-size:clamp(28px,3vw,44px);font-weight:500;line-height:1.18;letter-spacing:-.035em}.about-copy h2{max-width:none;white-space:nowrap}
    .advantages{background:var(--paper)}.advantages-heading{margin-bottom:clamp(34px,4.6vw,58px)}.advantages-heading h2{max-width:680px}.advantage-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}.advantage{min-height:clamp(180px,16vw,250px);display:grid;place-items:center;padding:clamp(22px,2.4vw,36px);border-right:1px solid var(--line);transition:color .26s ease,background .26s ease}.advantage:last-child{border-right:0}.advantage:hover{color:var(--white);background:var(--black)}.advantage h3{margin:0;font-size:clamp(18px,1.5vw,25px);font-weight:500;line-height:1.25;letter-spacing:-.02em;text-align:center}
    .contact{min-height:100dvh;display:grid;align-items:center;padding:clamp(56px,7vw,104px) 0}.contact-panel{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:clamp(48px,9vw,150px);padding:0;background:transparent}.contact-copy h2{margin:0;font-size:clamp(24px,2vw,32px);font-weight:500;line-height:1.2;letter-spacing:-.025em}.contact-list{display:grid;align-content:center;gap:0;margin:0;border-top:1px solid var(--line)}.contact-row{display:grid;grid-template-columns:minmax(80px,.3fr) minmax(0,1fr);gap:22px;padding:16px 0;border-bottom:1px solid var(--line)}.contact-row dt{color:var(--muted);font-size:11px}.contact-row dd{margin:0;font-size:clamp(13px,.82vw,15px);font-weight:500;line-height:1.55;overflow-wrap:anywhere}.contact-row a{text-decoration-thickness:1px;text-underline-offset:5px}.email-text{user-select:text}
    .site-footer{padding:32px 0 40px;border-top:1px solid var(--line)}.footer-layout{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:28px;color:var(--muted);font-size:11px}.footer-layout p{margin:0}.footer-layout .footer-brand{color:var(--ink);font-weight:760;text-align:center;letter-spacing:.08em}.footer-layout a{justify-self:end;text-decoration:none}.footer-layout a:hover{color:var(--ink)}.reveal{opacity:0;transform:translateY(28px)}.reveal.is-visible{opacity:1;transform:translateY(0);transition:opacity .76s cubic-bezier(.16,1,.3,1),transform .76s cubic-bezier(.16,1,.3,1)}.hero-lockup.reveal.is-visible{transition-delay:.12s}
    @media(min-width:1920px){:root{--content:min(1760px,calc(100vw - 160px))}}@media(min-width:2400px){:root{--content:min(2120px,calc(100vw - 240px))}body{font-size:20px}}
    @media(max-width:1100px){.nav{grid-template-columns:1fr auto}.nav-links{display:none}.advantage-list{grid-template-columns:repeat(2,minmax(0,1fr))}.advantage:nth-child(2){border-right:0}.advantage:nth-child(-n+2){border-bottom:1px solid var(--line)}}
    @media(max-width:760px){:root{--gutter:clamp(18px,5vw,28px)}.site-header{height:64px}.nav{grid-template-columns:minmax(0,1fr) auto auto;gap:12px}.brand{gap:7px}.brand-crop{width:34px;height:34px}.nav-links{gap:12px}.hero-inner{min-height:100svh;padding:76px 0 24px}.hero-lockup{gap:clamp(12px,3.2vw,18px)}.brand-mark{width:clamp(58px,17vw,74px)}.hero-wordmark{font-size:clamp(44px,12vw,56px)}.section,.contact{min-height:100svh;padding:58px 0}.about-section{align-items:start;padding-top:clamp(104px,17vh,150px);background-image:linear-gradient(180deg,rgba(250,249,246,1) 0%,rgba(250,249,246,.82) 17%,rgba(250,249,246,.08) 58%),url("assets/company-floral-background-v4.png");background-position:68% center;background-size:auto 100%}.about-grid{grid-template-columns:1fr}.about-copy h2,.advantages-heading h2{font-size:24px}.about-copy h2{max-width:none;white-space:nowrap}.contact-panel{grid-template-columns:1fr}.advantage-list{grid-template-columns:repeat(2,minmax(0,1fr))}.advantage{min-height:clamp(126px,34vw,170px);padding:18px;border-bottom:1px solid var(--line)}.advantage:nth-child(2n){border-right:0}.advantage h3{font-size:clamp(17px,4.8vw,22px)}.contact-panel{gap:32px}.contact-row{grid-template-columns:1fr;gap:4px;padding:14px 0}.footer-layout{grid-template-columns:1fr;align-items:start;gap:10px}.footer-layout .footer-brand{text-align:left}.footer-layout a{justify-self:start}}
    @media(max-width:760px) and (max-height:700px){.hero-inner{padding:68px 0 18px}.brand-mark{width:54px}.hero-wordmark{font-size:40px}.section,.contact{padding:48px 0}.advantages-heading{margin-bottom:28px}.advantage{min-height:112px}.contact-panel{gap:26px}.contact-row{padding:12px 0}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto;scroll-snap-type:none}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}}
  </style>
</head>
<body>
  <header class="site-header"><nav class="nav container" aria-label="主导航"><a class="brand" href="#top" aria-label="上海枷捷贸易有限公司首页"><span class="brand-crop" aria-hidden="true"></span><span class="brand-name">上海枷捷贸易有限公司</span></a><div class="nav-links"><a href="#about">关于我们</a><a href="#advantages">核心优势</a></div><a class="nav-contact" href="#contact">联系我们</a></nav></header>
  <main id="top">
    <section class="hero"><div class="hero-inner"><div class="hero-lockup reveal"><span class="brand-mark" aria-hidden="true"></span><h1 class="hero-wordmark" aria-label="JIA JIE"><span>JIA</span><span>JIE</span></h1></div></div></section>
    <section class="section about-section" id="about"><div class="about-grid container"><div class="about-copy reveal"><h2>一家销量很高的电商美妆公司</h2></div></div></section>
    <section class="section advantages" id="advantages"><div class="container"><div class="advantages-heading reveal"><h2>稳定合作，来自每个环节的认真</h2></div><div class="advantage-list"><article class="advantage reveal"><h3>稳定货源</h3></article><article class="advantage reveal"><h3>价格优势</h3></article><article class="advantage reveal"><h3>品牌授权</h3></article><article class="advantage reveal"><h3>售后服务</h3></article></div></div></section>
    <section class="section contact" id="contact"><div class="contact-panel container reveal"><div class="contact-copy"><h2>期待与您合作</h2></div><dl class="contact-list"><div class="contact-row"><dt>公司座机</dt><dd><span>021-59502728</span></dd></div><div class="contact-row"><dt>公司邮箱</dt><dd><span class="email-text">fumengyao@jiajietrade.email</span></dd></div><div class="contact-row"><dt>办公地址</dt><dd>上海市松江区金地威新·虹桥科创园（北园）2号楼104</dd></div></dl></div></section>
  </main>
  <footer class="site-footer"><div class="footer-layout container"><p>© <span id="year">2026</span> 上海枷捷贸易有限公司</p><p class="footer-brand">JIAJIE TRADING</p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">沪ICP备2026033233号</a></div></footer>
  <script>
    document.getElementById('year').textContent=new Date().getFullYear();
    const els=document.querySelectorAll('.reveal');
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce||!('IntersectionObserver'in window)){
      els.forEach(el=>el.classList.add('is-visible'));
    }else{
      const observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      },{threshold:.12});
      els.forEach(el=>observer.observe(el));
    }

    if(!reduce){
      const pages=[document.querySelector('.hero'),document.getElementById('about'),document.getElementById('advantages'),document.getElementById('contact')];
      let wheelLocked=false;
      let wheelTotal=0;
      let wheelReset;
      document.addEventListener('wheel',event=>{
        if(event.ctrlKey||Math.abs(event.deltaY)<4)return;
        wheelTotal+=event.deltaY;
        clearTimeout(wheelReset);
        wheelReset=setTimeout(()=>{wheelTotal=0},160);
        if(wheelLocked||Math.abs(wheelTotal)<32){
          event.preventDefault();
          return;
        }
        const current=pages.reduce((best,page,index)=>Math.abs(page.getBoundingClientRect().top)<Math.abs(pages[best].getBoundingClientRect().top)?index:best,0);
        const next=current+(wheelTotal>0?1:-1);
        if(next<0||next>=pages.length)return;
        event.preventDefault();
        wheelTotal=0;
        wheelLocked=true;
        pages[next].scrollIntoView({behavior:'smooth',block:'start'});
        setTimeout(()=>{wheelLocked=false},720);
      },{passive:false});
    }
  </script>
</body>
</html>
